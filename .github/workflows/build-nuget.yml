name: Build and release NuGet package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.0.2
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Azure Site Extension package
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set package version
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "1.0.${{ github.run_number }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $version"
          }
          "PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Clean generated output
        shell: pwsh
        run: |
          Remove-Item wwwroot, publish, bin, obj, artifacts/nuget -Recurse -Force -ErrorAction SilentlyContinue
          New-Item artifacts/nuget -ItemType Directory -Force | Out-Null

      - name: Build frontend
        shell: pwsh
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Publish self-contained extension
        shell: pwsh
        run: |
          dotnet publish ./LogicAppStorageInspector.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ./publish `
            -p:UseAppHost=true

      - name: Stage fresh frontend
        shell: pwsh
        run: |
          Remove-Item ./publish/wwwroot -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item ./wwwroot ./publish/wwwroot -Recurse -Force

      - name: Validate publish output
        shell: pwsh
        run: |
          $required = @(
            'LogicAppStorageInspector.exe',
            'LogicAppStorageInspector.dll',
            'LogicAppStorageInspector.deps.json',
            'LogicAppStorageInspector.runtimeconfig.json',
            'web.config',
            'scmApplicationHost.xdt',
            'wwwroot/index.html'
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path publish $path))) {
              throw "Missing publish file: $path"
            }
          }
          if (-not (Get-ChildItem publish/wwwroot/assets -File -ErrorAction SilentlyContinue)) {
            throw 'No frontend assets were published.'
          }
          $sourceRoot = (Resolve-Path wwwroot).Path
          $publishedRoot = (Resolve-Path publish/wwwroot).Path
          $sourceFiles = @(Get-ChildItem $sourceRoot -File -Recurse)
          $publishedFiles = @(Get-ChildItem $publishedRoot -File -Recurse)
          if ($sourceFiles.Count -ne $publishedFiles.Count) {
            throw "Frontend file count differs: source=$($sourceFiles.Count), publish=$($publishedFiles.Count)."
          }
          foreach ($source in $sourceFiles) {
            $relative = [IO.Path]::GetRelativePath($sourceRoot, $source.FullName)
            $published = Join-Path $publishedRoot $relative
            if (-not (Test-Path $published)) {
              throw "Frontend file was not staged: $relative"
            }
            $sourceHash = (Get-FileHash $source.FullName -Algorithm SHA256).Hash
            $publishedHash = (Get-FileHash $published -Algorithm SHA256).Hash
            if ($sourceHash -ne $publishedHash) {
              throw "Frontend file differs after staging: $relative"
            }
          }

      - name: Create NuGet package
        shell: pwsh
        run: |
          nuget pack ./LogicAppStorageInspector.nuspec `
            -Version $env:PACKAGE_VERSION `
            -BasePath $PWD `
            -OutputDirectory ./artifacts/nuget `
            -NonInteractive

      - name: Validate NuGet package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packages = @(Get-ChildItem artifacts/nuget/*.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected one package; found $($packages.Count)."
          }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $names = @($zip.Entries.FullName)
            $required = @(
              'README.md',
              'content/LogicAppStorageInspector.exe',
              'content/LogicAppStorageInspector.dll',
              'content/web.config',
              'content/scmApplicationHost.xdt',
              'content/wwwroot/index.html'
            )
            foreach ($path in $required) {
              if ($names -notcontains $path) { throw "Missing package entry: $path" }
            }
            $nuspecEntry = @($zip.Entries | Where-Object FullName -Like '*.nuspec')
            if ($nuspecEntry.Count -ne 1) { throw 'Expected one embedded nuspec.' }
            $reader = [System.IO.StreamReader]::new($nuspecEntry[0].Open())
            try { [xml]$spec = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $metadata = $spec.SelectSingleNode("/*[local-name()='package']/*[local-name()='metadata']")
            $author = $metadata.SelectSingleNode("*[local-name()='authors']").InnerText
            $readme = $metadata.SelectSingleNode("*[local-name()='readme']").InnerText
            $packageType = $metadata.SelectSingleNode("*[local-name()='packageTypes']/*[local-name()='packageType']").GetAttribute('name')
            if ($author -cne 'Mohammed Barqawi') { throw "Unexpected package author: $author" }
            if ($readme -cne 'README.md') { throw "Unexpected package README: $readme" }
            if ($packageType -ne 'AzureSiteExtension') { throw 'AzureSiteExtension package type is missing.' }

            $frontendRoot = (Resolve-Path publish/wwwroot).Path
            foreach ($frontendFile in Get-ChildItem $frontendRoot -File -Recurse) {
              $relative = [IO.Path]::GetRelativePath($frontendRoot, $frontendFile.FullName).Replace('\', '/')
              $entry = $zip.GetEntry("content/wwwroot/$relative")
              if ($null -eq $entry) { throw "Frontend file is missing from package: $relative" }
              $stream = $entry.Open()
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try {
                $packageHash = [Convert]::ToHexString($sha256.ComputeHash($stream))
              }
              finally {
                $sha256.Dispose()
                $stream.Dispose()
              }
              $publishedHash = (Get-FileHash $frontendFile.FullName -Algorithm SHA256).Hash
              if ($packageHash -ne $publishedHash) {
                throw "Packaged frontend file differs from publish output: $relative"
              }
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: LogicAppStorageInspector-${{ env.PACKAGE_VERSION }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Release $tag already exists. Run the workflow with a new package version."
          }
          gh release create $tag artifacts/nuget/*.nupkg `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Logic App Storage Inspector $env:PACKAGE_VERSION" `
            --generate-notes